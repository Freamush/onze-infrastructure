name: Build Drift Checker

on:
  push:
    branches: [main]
    paths: ['infra/providers.tf', 'docker/drift/**', 'infra/.terraform.lock.hcl', '.github/workflows/build-drift.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

concurrency:
  group: drift-build
  cancel-in-progress: false

env:
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/drift-checker
  JOB_NAME: ${{ vars.JOB_NAME }}
  JOB_RG: Secure-Landing-Zone-Apps


jobs:
    build:
        name: Build, scan, sign, deploy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Image Tag
              id: meta
              run: echo "ref=$IMAGE:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

            - name: Build image
              run: docker build -f docker/drift/Dockerfile -t "${{ steps.meta.outputs.ref }}" .

            - name: Trivy report (HIGH, CRITICAL)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ steps.meta.outputs.ref }}
                format: sarif
                output: trivy.sarif
                exit-code: '0'
                ignore-unfixed: true
                severity: 'CRITICAL,HIGH'

            - name: Upload Trivy report
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                sarif_file: trivy.sarif
                category: drift-checker-image

            - name: Trivy gate (CRITICAL)
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ steps.meta.outputs.ref }}
                format: table
                exit-code: '1'
                ignore-unfixed: true
                severity: 'CRITICAL'
        
            - name: SBOM (Syft)
              uses: anchore/sbom-action@v0 
              with:
                image: ${{ steps.meta.outputs.ref }}
                format: spdx-json
                output-file: sbom.spdx.json
            - name: Azure Login
              uses: azure/login@v2
              with:
                 client-id: ${{ vars.AZURE_BUILD_CLIENT_ID }}
                 tenant-id: ${{ vars.AZURE_TENANT_ID }}
                 subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Push to ACR
              id: push
              run: | 
                az acr login --name "$ACR_NAME"
                docker push "${{ steps.meta.outputs.ref }}"
                DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.meta.outputs.ref }}")
                echo "ref=$DIGEST" >> "$GITHUB_OUTPUT"

            - uses: sigstore/cosign-installer@v3
            
            - name: Sign image and attach SBOM
              env:
                REF: ${{ steps.push.outputs.ref }}
              run: |
                cosign sign --yes "$REF"
                cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF" 

            - name: Update Container Apps Job
              env: 
                REF: ${{ steps.push.outputs.ref }}
              run: |
                az config set extension.use_dynamic_install=yes_without_prompt
                az containerapp job update -n "$JOB_NAME" -g "$JOB_RG" --image "$REF"

            - uses: actions/upload-artifact@v4
              with:
                name: sbom
                path: sbom.spdx.json
