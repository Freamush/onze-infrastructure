name: Infracost breakdown (legacy)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  breakdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_LEGACY_API_KEY }}

      - name: Cost breakdown
        run: infracost breakdown --path infra --format table
